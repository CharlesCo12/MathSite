# Site-wide settings. Jekyll reads this file once at startup,
# so restart `jekyll serve` after editing it.

title: Carlos Cordoba-Caycedo, Mathematics.
description: A personal website for Carlos Cordoba-Caycedo, a "model" mathematician.

# Dimensions
max_width: 920px
timezone: America/Toronto

# IMPORTANT for links:
#  - If your repo is named  <username>.github.io   ->  keep baseurl EMPTY ("")
#  - If your repo is named  anything-else (e.g. math-site)
#        ->  set baseurl to "/anything-else"   (leading slash, no trailing slash)
baseurl: "/MathSite"

footer_text: >
  Last Updated: {{ site.time | date: "%B %-d, %Y" }}.
  This website is built with Jekyll and hosted on GitHub Pages. The source code is available on GitHub.

# Markdown engine options (kramdown is Jekyll's default).
# In Markdown, write math as $$ ... $$ (inline when inside a sentence,
# displayed when alone on its own lines). kramdown converts it to
# \( ... \) / \[ ... \], which MathJax (see _layouts/default.html) typesets.
kramdown:
  math_engine: mathjax

# Files Jekyll should not publish
exclude:
  - README.md

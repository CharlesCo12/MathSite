# Photos for the gallery on the Random page.
#
# One entry per photo. To add a photo: copy the image into assets/img/ and add
# a block like the ones below. To remove one, delete its block. The order here
# is the order on the page.
#
#   file   name of the image inside assets/img/            (required)
#   title  short title: shown on hover and in the viewer   (required)
#   desc   one or two sentences, shown in the viewer       (optional)
#   pos    which part of the photo stays visible in the square thumbnail,
#          as "x% y%" (default "50% 50%", the centre). Example: "50% 20%" keeps
#          the upper part of a tall photo.                 (optional)
#
# Titles and descriptions below are placeholders written from what is visible
# in each photo: replace them with your own words.

